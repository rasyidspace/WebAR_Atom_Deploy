<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATOM AR Learning - Detail Materi</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages.css">

  <style>
    /* Specific styles for detail page */
    .detail-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
      padding: 16px 0;
    }
    
    .detail-icon-wrapper {
      width: 96px;
      height: 96px;
      background: var(--surface);
      color: var(--primary);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    
    .detail-icon-wrapper svg {
      width: 48px;
      height: 48px;
    }

    .detail-title {
      font-size: 28px;
      line-height: 1.2;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .detail-section {
      background: var(--white);
      border-radius: var(--radius-card);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--surface-alt);
    }

    .detail-section-title {
      font-size: 18px;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-list {
      padding-left: 20px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .detail-list li {
      font-size: 15px;
      color: var(--text-light);
      line-height: 1.5;
    }

    .fun-fact-box {
      background: var(--accent);
      color: var(--text);
      padding: 20px;
      border-radius: var(--radius-card);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    
    .fun-fact-box::before {
      content: '💡';
      position: absolute;
      top: -10px;
      right: -10px;
      font-size: 80px;
      opacity: 0.2;
    }
    
    .fun-fact-title {
      font-weight: 800;
      margin-bottom: 8px;
      font-family: 'Nunito', sans-serif;
    }

    .fixed-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--background);
      padding: 16px 24px 24px;
      box-shadow: 0 -4px 24px rgba(74, 55, 40, 0.08);
      z-index: 100;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
    }
    
    /* Ensure scroll container doesn't get hidden behind the fixed bar */
    .detail-scroll-container {
      padding-bottom: 120px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="bg-pattern"></div>

    <section class="view active">
      <div class="top-bar">
        <button class="btn-icon back-btn" onclick="window.location.href='materi.html'">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2 id="top-bar-title">Detail Materi</h2>
      </div>
      
      <div class="scroll-container detail-scroll-container" id="detail-container">
        <!-- Loading state -->
        <div style="text-align:center; padding: 40px; color: var(--text-light);" id="loading-indicator">
          Memuat detail materi...
        </div>
      </div>

      <div class="fixed-bottom-bar" id="bottom-action-bar" style="display: none;">
        <button class="btn btn-primary w-100" id="btn-lihat-ar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          Lihat AR Model Ini
        </button>
      </div>
    </section>

  </div>

  <script src="js/main.js"></script>
  <script src="js/materi-detail.js"></script>
</body>
</html>
