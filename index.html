<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Struktur Atom - Home</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div class="app-container">
    <div class="bg-pattern"></div>

    <section id="view-home" class="view active">
      <div class="hero-content">
        <div class="hero-illustration">
          <svg viewBox="0 0 200 200" width="120" height="120" class="hero-atom-icon">
            <g stroke="var(--primary)" stroke-width="6" fill="none" stroke-linecap="round">
              <ellipse cx="100" cy="100" rx="40" ry="90" transform="rotate(30 100 100)" opacity="0.8"/>
              <ellipse cx="100" cy="100" rx="40" ry="90" transform="rotate(90 100 100)" opacity="0.8"/>
              <ellipse cx="100" cy="100" rx="40" ry="90" transform="rotate(150 100 100)" opacity="0.8"/>
            </g>
            <circle cx="100" cy="100" r="16" fill="var(--primary)"/>
            <circle cx="100" cy="10" r="8" fill="var(--secondary)" transform="rotate(30 100 100)"/>
            <circle cx="100" cy="190" r="8" fill="var(--secondary)" transform="rotate(90 100 100)"/>
            <circle cx="100" cy="10" r="8" fill="var(--secondary)" transform="rotate(150 100 100)"/>
          </svg>
        </div>
        <h1 class="hero-title">Belajar Atom &<br>Augmented Reality</h1>
        <p class="hero-subtitle">Pelajari perkembangan teori atom melalui materi interaktif yang dirancang khusus untuk pembelajaran sains.</p>
        
        <div class="hero-actions">
          <button class="btn btn-primary" onclick="navigate('play')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Mulai Belajar
          </button>
          <div class="btn-group-row">
            <button class="btn btn-secondary w-50" onclick="navigate('petunjuk')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              Petunjuk
            </button>
            <button class="btn btn-secondary w-50" onclick="navigate('profil')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Profil
            </button>
          </div>
        </div>
      </div>
    </section>

  </div> <!-- End App Container -->

  <script src="js/main.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
