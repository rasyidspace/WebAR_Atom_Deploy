<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Struktur Atom - Preview 3D</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages.css">

  <style>
    /* Viewer specific styles */
    .viewer-canvas-container {
      position: relative;
      width: 100%;
      height: 65vh; /* 65% of screen */
      background: var(--background);
      overflow: hidden;
    }
    
    .viewer-help-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 20px;
      display: flex;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--surface-alt);
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 10;
      white-space: nowrap;
    }
    .help-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
    }
    .help-item svg {
      color: var(--primary);
    }

    .viewer-info-panel {
      flex: 1;
      background: var(--white);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .viewer-info-panel h3 {
      font-size: 20px;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .viewer-info-panel p {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 24px;
      line-height: 1.5;
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="app-container" style="background: var(--background);">
    
    <div class="top-bar" style="background: transparent;">
      <button class="btn-icon back-btn" id="btn-back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 id="viewer-title">Model Atom</h2>
    </div>
    
    <div class="viewer-canvas-container" id="canvas-container">
      <canvas id="three-canvas" style="width: 100%; height: 100%; touch-action: none;"></canvas>
      
      <!-- Help Overlay -->
      <div class="viewer-help-overlay" id="help-overlay">
        <div class="help-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Putar
        </div>
        <div class="help-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          Zoom
        </div>
      </div>
    </div>

    <div class="viewer-info-panel">
      <h3 id="panel-title">Memuat...</h3>
      <p id="panel-desc">Silakan tunggu sebentar...</p>
      
      <button class="btn btn-primary w-100" id="btn-lihat-ar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Lihat dalam AR
      </button>
    </div>

  </div>

  <!-- Three.js Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script src="js/main.js"></script>
  <script type="module" src="js/viewer.js"></script>
</body>
</html>
